[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntwitch"
version = "1.1.0"
description = "Watch Twitch in VLC with live chat in your terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "streamlink>=6.0.0",
    "textual>=0.86.0",
    "rich>=13.0.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
nTwitch = "ntwitch.cli:run"

[tool.setuptools]
packages = ["ntwitch"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
